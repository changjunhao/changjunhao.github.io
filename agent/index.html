<script>
/* ============================================================
 * 配置:阿里云函数计算(FC)部署完成后,把函数访问地址填到这里。
 * 例如:const AGENT_API_URL = "https://changjunhao-agent-xxxx.cn-hangzhou.fcapp.run/chat";
 * 留空时页面可正常浏览,发送消息会提示尚未接入后端。
 * ============================================================ */
const AGENT_API_URL = "https://jh-agent-xwcmmozjew.cn-beijing.fcapp.run/chat";

const WELCOME = "你好,我是常君豪的 AI 求职助手。\n\n他的简历只能装下两页,我可以讲得更多:项目里的技术决策、踩过的坑、带团队的方式……想从哪里聊起?也可以直接点左边的预设问题。";

const messagesEl = document.getElementById("messages");
const scrollEl = document.getElementById("scroll");
const composerEl = document.getElementById("composer");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

const history = []; // {role: "user"|"assistant", content: string}
let streaming = false;
let abortCtrl = null;

/* ---------- 极简 Markdown 渲染(加粗 / 行内代码 / 链接 / 列表) ---------- */
function renderMarkdown(text) {
  const esc = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => s
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  const blocks = [];
  let listBuf = [];
  for (const rawLine of esc.split("\n")) {
    const line = rawLine.trimEnd();
    const m = line.match(/^\s*[-*]\s+(.*)$/);
    if (m) { listBuf.push("<li>" + inline(m[1]) + "</li>"); continue; }
    if (listBuf.length) { blocks.push("<ul>" + listBuf.join("") + "</ul>"); listBuf = []; }
    if (line.trim() === "") { blocks.push(""); continue; }
    blocks.push("<p>" + inline(line) + "</p>");
  }
  if (listBuf.length) blocks.push("<ul>" + listBuf.join("") + "</ul>");
  return blocks.join("\n").replace(/\n{2,}/g, "\n");
}

/* ---------- DOM ---------- */
function addBubble(role) {
  const row = document.createElement("div");
  row.className = "msg " + (role === "user" ? "msg--user" : "msg--ai");
  const bubble = document.createElement("div");
  bubble.className = "msg__bubble";
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollEl.scrollTop = scrollEl.scrollHeight;
  return bubble;
}

function setBubble(bubble, text, stream) {
  bubble.innerHTML = renderMarkdown(text);
  bubble.classList.toggle("streaming", !!stream);
  scrollEl.scrollTop = scrollEl.scrollHeight;
}

function autoresize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
}
inputEl.addEventListener("input", autoresize);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    composerEl.requestSubmit();
  }
});

document.getElementById("chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip || streaming) return;
  send(chip.textContent.trim());
});

composerEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  send(text);
});

/* ---------- 发送与流式接收 ---------- */
async function send(text) {
  streaming = true;
  sendEl.disabled = true;
  inputEl.value = "";
  autoresize();

  history.push({ role: "user", content: text });
  addBubble("user").textContent = text;

  const bubble = addBubble("assistant");
  bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

  if (!AGENT_API_URL) {
    setBubble(bubble, "后端尚未接入:站长还没部署云函数。如果你是站长本人,请按 worker/README.md 部署后,把地址填进本页的 AGENT_API_URL。", false);
    finish(); return;
  }

  abortCtrl = new AbortController();
  let answer = "";

  try {
    const resp = await fetch(AGENT_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-12) }),
      signal: abortCtrl.signal,
    });

    if (!resp.ok) {
      const errText = await resp.text().catch(() => "");
      throw new Error("HTTP " + resp.status + (errText ? " · " + errText.slice(0, 120) : ""));
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let firstChunk = true;

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const event = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of event.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const payload = line.slice(5).trim();
          if (payload === "[DONE]") { buffer = ""; break; }
          try {
            const json = JSON.parse(payload);
            const delta = json.choices && json.choices[0] && json.choices[0].delta;
            if (delta && delta.content) {
              if (firstChunk) { bubble.innerHTML = ""; firstChunk = false; }
              answer += delta.content;
              setBubble(bubble, answer, true);
            }
          } catch (_) { /* 忽略不完整的行 */ }
        }
      }
    }
    if (!answer) throw new Error("空响应");
    setBubble(bubble, answer, false);
    history.push({ role: "assistant", content: answer });
  } catch (err) {
    if (err.name === "AbortError") {
      setBubble(bubble, answer || "(已停止)", false);
    } else {
      setBubble(bubble, "出了点问题,没能让 AI 开口(" + err.message + ")。\n\n也可以直接邮件联系他本人:[changjunhao@outlook.com](mailto:changjunhao@outlook.com)。", false);
    }
  }
  finish();
}

function finish() {
  streaming = false;
  sendEl.disabled = false;
  inputEl.focus();
}

/* ---------- 开场白 ---------- */
addBubble("assistant");
setBubble(messagesEl.lastChild.querySelector(".msg__bubble"), WELCOME, false);
inputEl.focus();
</script>
</body>
